name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    name: Nx Affected
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set base/head for affected
        uses: nrwl/nx-set-shas@v5

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint affected
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Test affected
        run: pnpm exec nx affected -t test --parallel=3 --ci --code-coverage

      - name: Build affected
        run: pnpm exec nx affected -t build --parallel=2

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shell + remote-widgets (production)
        run: pnpm exec nx run-many -t build --projects=shell,remote-widgets --configuration=production --parallel=2

      - name: Serve remote-widgets on port 4201
        run: npx serve dist/apps/remote-widgets --listen 4201 &

      - name: Run Cypress against shell (serve-static)
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: pnpm exec nx e2e shell --configuration=ci --no-cache
        env:
          CYPRESS_BASE_URL: http://localhost:4200

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/shell/cypress/screenshots
          retention-days: 7

  size-limit:
    name: Size Limit
    runs-on: ubuntu-latest
    needs: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared lib sizes
        run: pnpm size

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all Storybooks
        run: pnpm exec nx run-many -t build-storybook --parallel=2

      - name: Upload Storybook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: |
            libs/shared/ui-button/storybook-static
            libs/shared/ui-input/storybook-static
            libs/shared/ui-table/storybook-static
            libs/shared/ui-modal/storybook-static
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shell (production)
        run: pnpm exec nx build shell --configuration=production

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  release:
    name: Release
    needs: [main, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version and changelog (nx release)
        run: pnpm exec nx release --skip-publish --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shell for production
        run: pnpm exec nx build shell --configuration=production

      - name: Build remote-widgets for production
        run: pnpm exec nx build remote-widgets --configuration=production

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-dist
          path: dist/apps/shell/browser
          retention-days: 7

      - name: Upload remote-widgets artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-widgets-dist
          path: dist/apps/remote-widgets
          retention-days: 7

      - name: Analyse bundle size
        run: |
          pnpm exec source-map-explorer 'dist/apps/shell/browser/*.js' \
            --html dist/apps/shell/bundle-report.html \
            --no-border-checks

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: dist/apps/shell/bundle-report.html
          retention-days: 30


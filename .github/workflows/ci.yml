name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    name: Nx Affected
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set base/head for affected
        uses: nrwl/nx-set-shas@v4

      - name: Lint affected
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Test affected
        run: pnpm exec nx affected -t test --parallel=3 --ci --code-coverage

      - name: Build affected
        run: pnpm exec nx affected -t build --parallel=2

  release:
    name: Release
    needs: main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shell for production
        run: pnpm exec nx build shell --configuration=production

      - name: Build remote-widgets for production
        run: pnpm exec nx build remote-widgets --configuration=production

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-dist
          path: dist/apps/shell/browser
          retention-days: 7

      - name: Upload remote-widgets artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-widgets-dist
          path: dist/apps/remote-widgets
          retention-days: 7


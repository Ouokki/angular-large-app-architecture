<div class="app-frame">
  <aside class="app-sidebar" aria-label="Application navigation">
    <a class="brand" routerLink="/dashboard" aria-label="Angular Architecture dashboard">
      <span class="brand-mark" aria-hidden="true">AA</span>
      <span class="brand-copy">
        <strong>Angular Architecture</strong>
        <small>Enterprise workspace</small>
      </span>
    </a>

    <nav class="app-nav" aria-label="Primary navigation">
      <a mat-button routerLink="/dashboard" routerLinkActive="nav-active">Dashboard</a>
      <a mat-button routerLink="/settings" routerLinkActive="nav-active">Settings</a>
      <a mat-button routerLink="/widgets" routerLinkActive="nav-active">Widgets</a>
    </nav>

    <div class="sidebar-panel">
      <span class="panel-kicker">Runtime</span>
      <strong>Module Federation</strong>
      <small>Shell and remote widgets are served locally.</small>
    </div>
  </aside>

  <section class="workspace">
    <header class="workspace-header">
      <div>
        <p class="workspace-kicker">Architecture Console</p>
        <h1>Application workspace</h1>
      </div>
      <div class="workspace-status" aria-label="Environment status">
        <span>Local</span>
        <strong>Healthy</strong>
      </div>
    </header>

    @if (isNavigating()) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading page"></mat-progress-bar>
    }

    <main class="app-shell-content">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>

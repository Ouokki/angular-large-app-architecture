<mat-form-field class="ui-input-field" appearance="outline" subscriptSizing="dynamic">
  @if (label()) {
  <mat-label>{{ label() }}</mat-label>
  }

  <input
    matInput
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [formControl]="internalControl"
    (blur)="onBlur()"
    [attr.aria-invalid]="hasError || null"
    [attr.aria-describedby]="errorMessage || hint() ? id() + '-desc' : null"
  />

  @if (errorMessage) {
  <mat-error [id]="id() + '-desc'">{{ errorMessage }}</mat-error>
  } @else if (hint()) {
  <mat-hint [id]="id() + '-desc'">{{ hint() }}</mat-hint>
  }
</mat-form-field>

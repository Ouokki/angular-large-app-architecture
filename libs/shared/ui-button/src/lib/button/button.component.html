<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() || null"
  [attr.aria-disabled]="disabled() || null"
  (click)="onClick($event)"
  class="inline-flex items-center justify-center font-medium rounded transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:cursor-not-allowed"
  [class]="variantClasses + ' ' + sizeClasses"
>
  @if (loading()) {
  <svg
    class="animate-spin"
    [class]="size() === 'sm' ? 'h-3.5 w-3.5' : size() === 'lg' ? 'h-5 w-5' : 'h-4 w-4'"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <circle
      class="opacity-25"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="4"
    ></circle>
    <path
      class="opacity-75"
      fill="currentColor"
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
    ></path>
  </svg>
  }
  <ng-content />
</button>
